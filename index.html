    <style>
        .balloons-wrapper {
            opacity: 0;
            pointer-events: none;
        }
        body:not(.container) .balloons-wrapper {
            animation: fadeInBalloons 1.5s ease forwards;
            animation-delay: 6s;
        }
        @keyframes fadeInBalloons {
            0% { opacity: 0; pointer-events: none; }
            100% { opacity: 1; pointer-events: auto; }
        }

        .balloon {
            position: absolute;
            cursor: pointer;
            z-index: 100;
            width: var(--size);
            height: calc(var(--size) * 1.42);
            animation: float 3s ease-in-out infinite alternate;
            transition: transform 0.2s;
            filter: drop-shadow(0 8px 12px rgba(0,0,0,0.35));
        }
        .balloon:hover { 
            transform: rotate(var(--rot)) scale(1.2); 
            animation-play-state: paused; 
        }
        .balloon__top {
            position: absolute;
            top: 0;
            left: 50%;
            width: 100%;
            height: 72%;
            transform: translateX(-50%);
            border-radius: 50% 50% 45% 45% / 54% 54% 46% 46%;
            background:
                radial-gradient(circle at 32% 22%, rgba(255,255,255,0.75) 0 8%, transparent 9%),
                linear-gradient(90deg, rgba(255,255,255,0.3) 0 17%, transparent 18% 31%, rgba(255,255,255,0.22) 32% 47%, transparent 48% 61%, rgba(0,0,0,0.12) 62% 76%, transparent 77%),
                linear-gradient(135deg, var(--balloon-a), var(--balloon-b));
            box-shadow: inset 0 -8px 14px rgba(0,0,0,0.16);
        }
        .balloon__top::after {
            content: "";
            position: absolute;
            left: 50%;
            bottom: -9%;
            width: 30%;
            height: 18%;
            transform: translateX(-50%);
            background: var(--balloon-b);
            clip-path: polygon(18% 0, 82% 0, 100% 100%, 0 100%);
        }
        .balloon__basket {
            position: absolute;
            left: 50%;
            bottom: 0;
            width: 34%;
            height: 18%;
            transform: translateX(-50%);
            border-radius: 4px 4px 7px 7px;
            background: linear-gradient(135deg, #b77a45, #7a4829);
            box-shadow: inset 0 3px 0 rgba(255,255,255,0.25);
        }
        .balloon__basket::before,
        .balloon__basket::after {
            content: "";
            position: absolute;
            top: -88%;
            width: 2px;
            height: 100%;
            background: rgba(255,255,255,0.82);
        }
        .balloon__basket::before {
            left: 12%;
            transform: rotate(-14deg);
        }
        .balloon__basket::after {
            right: 12%;
            transform: rotate(14deg);
        }
        @keyframes float {
            0% { transform: rotate(var(--rot)) translateY(0); }
            100% { transform: rotate(var(--rot)) translateY(-15px); }
        }

        .click-instruction {
            position: absolute;
            top: 10%;
            left: 0;
            width: 100%;
            text-align: center;
            color: #fff;
            font-family: 'Caveat', cursive;
            font-size: clamp(40px, 8vw, 55px);
            font-weight: bold;
            text-shadow: 2px 2px 5px rgba(0,0,0,0.5);
            padding: 0 15px;
            box-sizing: border-box;
            z-index: 100;
        }
        .click-instruction small {
            display: block;
            margin-top: 6px;
            font-size: clamp(20px, 4vw, 28px);
            font-weight: 500;
        }

        .env1 { top: 12%; left: 8%; animation-delay: 0s; --rot: 0deg; --size: 60px; --balloon-a: #ff8db4; --balloon-b: #ff477e; }
        .env2 { top: 18%; left: 78%; animation-delay: 0.5s; --rot: 0deg; --size: 55px; --balloon-a: #ffd36a; --balloon-b: #f59f2a; }
        .env3 { top: 32%; left: 42%; animation-delay: 1.2s; --rot: 0deg; --size: 65px; --balloon-a: #9de2ff; --balloon-b: #2fa7e8; }
        .env4 { top: 35%; left: 12%; animation-delay: 0.8s; --rot: 0deg; --size: 50px; --balloon-a: #ff9da2; --balloon-b: #e84c5b; }
        .env5 { top: 45%; left: 85%; animation-delay: 1.5s; --rot: 0deg; --size: 60px; --balloon-a: #d4a1ff; --balloon-b: #9650df; }
        .env6 { top: 28%; left: 65%; animation-delay: 0.2s; --rot: 0deg; --size: 55px; --balloon-a: #a8f0bf; --balloon-b: #37b66b; }
        .env7 { top: 55%; left: 15%; animation-delay: 2.0s; --rot: 0deg; --size: 65px; --balloon-a: #ffb1d4; --balloon-b: #ea5a9a; }

            box-shadow: 0 5px 15px rgba(0,0,0,0.5);

        }

        }
